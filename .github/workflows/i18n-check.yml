name: i18n-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  i18n:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 多场景空间资产运营平台/platform-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-i18n.mjs
