name: scene-e2e
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  scene-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local123
          MYSQL_DATABASE: bp_platform_v2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plocal123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: 多场景空间资产运营平台
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply schema and seed
        run: |
          shopt -s nullglob
          mysql -h 127.0.0.1 -uroot -plocal123 bp_platform_v2 < platform-sql/001_platform_core.sql
          for f in platform-sql/0{02..24}_*.sql; do mysql -h 127.0.0.1 -uroot -plocal123 bp_platform_v2 < "$f"; done
          mysql -h 127.0.0.1 -uroot -plocal123 bp_platform_v2 < platform-local/seed/000_ci_seed.sql
          for f in platform-sql/025_scene_menus_roles.sql platform-sql/026_scene_roles_cleanup.sql platform-sql/027_cleanup_verify_projects.sql; do mysql -h 127.0.0.1 -uroot -plocal123 bp_platform_v2 < "$f"; done
      - name: Build backend
        run: mvn -q -DskipTests package
        working-directory: 多场景空间资产运营平台/platform-backend
      - name: Start backend
        env:
          SPRING_PROFILES_ACTIVE: local
          SERVER_PORT: 8091
          DB_URL: jdbc:mysql://127.0.0.1:3306/bp_platform_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          DB_USER: root
          DB_PASSWORD: local123
        run: |
          nohup java -jar target/multi-scene-platform.jar > /tmp/scene-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8091/actuator/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/scene-e2e.log
          exit 1
        working-directory: 多场景空间资产运营平台/platform-backend
      - name: Verify scene data through API
        run: node scripts/check-scene-data.mjs
        working-directory: 多场景空间资产运营平台/platform-frontend
      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: scene-e2e-backend-log
          path: /tmp/scene-e2e.log
