openapi: 3.0.3
info:
  title: 业务平台 IoT 回调契约
  version: 1.0.0
  description: |
    本文件定义 **IoT 平台 → 业务平台** 的回调接口（C1–C8），以及 **平台 → IoT** 的下行接口清单（写在 x-iot-downstream，供 IoT 方实现对照）。

    ## 鉴权
    所有回调请求必须携带以下 Header：

    | Header | 说明 |
    |---|---|
    | X-Iot-AppId | 应用标识 |
    | X-Iot-Timestamp | Unix 时间戳（秒） |
    | X-Iot-Nonce | 随机串（10 分钟内唯一） |
    | X-Iot-Signature | 十六进制 HMAC-SHA256 |

    ## 签名算法
    ```
    canonical = method + "\n" + path + "\n" + appId + "\n" + timestamp + "\n" + nonce + "\n" + sha256Hex(body)
    signature = hex(HMAC-SHA256(appSecret, canonical))
    ```

    ## 响应
    成功返回 `{"code":"SUCCESS","message":"ok"}`；非 SUCCESS 由 IoT 按契约重试。
    平台对重复 `eventId` / `requestId` 幂等处理并返回 SUCCESS，便于 IoT 停止重试。

    ## 测试向量
    ```
    appId      = bp-test-app
    appSecret  = bp-test-secret
    timestamp  = 1793029200
    nonce      = a1b2c3d4e5f6
    body       = {"eventId":"EV202610270001","deviceId":"LK00005771","identifier":"LOW_BATTERY","eventLevel":"WARN","eventTime":"2026-10-27 06:00:00","body":"{\"battery\":12}"}
    bodySha256 = 518c79a1832e29fb6989e79d28d163b50176f9fadf7a7e84b58ce88be4dced24
    signature  = e41ddcfe92e7308f232d904e3d86e4857b175d8e5fa3f0810b2039bdc365b2ad
    ```
servers:
  - url: http://192.168.31.11:8080
    description: 测试环境

paths:
  /api/callback/iot/event:
    post:
      summary: C1 设备事件上报
      description: 低电量、防拆、试错、胁迫、离线、超功率、本地合闸、抄表读数等。
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEvent'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/callback/iot/access:
    post:
      summary: C2 开门记录上报（单条或批量）
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AccessRecord'
                - type: array
                  items:
                    $ref: '#/components/schemas/AccessRecord'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/callback/iot/command/ack:
    post:
      summary: C3 指令回执（开锁/重启/校时/拉合闸）
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandAck'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/callback/iot/grant/ack:
    post:
      summary: C4 授权任务结果
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantAck'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/callback/iot/heartbeat:
    post:
      summary: C5 设备心跳 / 状态
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/callback/iot/meter:
    post:
      summary: C6 表计读数（设备任务主动上报）
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/MeterReading'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/callback/iot/device-status:
    post:
      summary: C7 设备上下线事件
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceStatus'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

  /api/callback/iot/alarm-ack:
    post:
      summary: C8 告警恢复
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlarmAck'
      responses:
        '200':
          $ref: '#/components/responses/Ok'

components:
  parameters:
    AppId:
      name: X-Iot-AppId
      in: header
      required: true
      schema: { type: string }
    Timestamp:
      name: X-Iot-Timestamp
      in: header
      required: true
      description: Unix 秒；与平台时间偏差超过 iot.callback.timestampToleranceSeconds 视为重放
      schema: { type: string, example: '1793029200' }
    Nonce:
      name: X-Iot-Nonce
      in: header
      required: true
      description: 10 分钟内唯一，重复视为重放
      schema: { type: string, example: a1b2c3d4e5f6 }
    Signature:
      name: X-Iot-Signature
      in: header
      required: true
      schema: { type: string, example: e41ddcfe92e7308f232d904e3d86e4857b175d8e5fa3f0810b2039bdc365b2ad }

  responses:
    Ok:
      description: 成功（幂等重复也返回 SUCCESS）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ack'
    Unauthorized:
      description: 验签失败 / 时间戳超窗 / nonce 重放
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ack'

  schemas:
    Ack:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum: [SUCCESS, SIGNATURE_INVALID, TIMESTAMP_EXPIRED, NONCE_REPLAY, PARAM_INVALID, SERVER_ERROR]
        message:
          type: string
      example:
        code: SUCCESS
        message: ok

    DeviceEvent:
      type: object
      required: [eventId, deviceId, identifier, eventTime]
      properties:
        eventId:
          type: string
          description: 事件唯一号（平台按此幂等）
        deviceId:
          type: string
        lockId:
          type: string
          description: 门锁设备有值
        identifier:
          type: string
          enum: [OPEN, ONLINE, OFFLINE, LOW_BATTERY, BATTERY_RESTORED, TAMPER, TRIAL_ERROR, DURESS, POWER_OVER, LOCAL_SWITCH, METER_READ, OTHER]
        eventLevel:
          type: string
          enum: [INFO, WARN, CRITICAL]
        eventTime:
          type: string
          format: date-time
          description: yyyy-MM-dd HH:mm:ss
        body:
          type: string
          description: 事件附加内容，JSON 字符串（如 {"battery":12}）
      example:
        eventId: EV202610270001
        deviceId: LK00005771
        identifier: LOW_BATTERY
        eventLevel: WARN
        eventTime: '2026-10-27 06:00:00'
        body: '{"battery":12}'

    AccessRecord:
      type: object
      required: [eventId, lockId, openTime]
      properties:
        eventId: { type: string }
        lockId: { type: string }
        deviceId: { type: string }
        personId: { type: string, description: 平台人员ID，未匹配可为空 }
        targetUserMobile: { type: string }
        openType:
          type: string
          enum: [PASSWORD, CARD, FACE, QRCODE, REMOTE, MECHANICAL, OTHER]
        openTime: { type: string, format: date-time }
        isTrusted: { type: integer, enum: [0, 1], description: 1=可信开门 }

    CommandAck:
      type: object
      required: [requestId, code]
      properties:
        requestId: { type: string, description: 平台生成，回传原值 }
        lockId: { type: string }
        meterNo: { type: string, description: 拉合闸时使用 }
        code:
          type: string
          description: IoT 结果码，0 或 SUCCESS 表示成功
        message: { type: string }
        deviceTime: { type: string, format: date-time }
        costMs: { type: integer }
      example:
        requestId: CMD202610270001
        lockId: LK00005771
        code: '0'
        message: ok
        deviceTime: '2026-10-27 01:20:00'
        costMs: 320

    GrantAck:
      type: object
      required: [serviceId, success]
      properties:
        serviceId: { type: string, description: 对应 grant_task.service_id }
        success: { type: boolean }
        failCount: { type: integer }
        devices:
          type: array
          items:
            type: object
            properties:
              lockId: { type: string }
              success: { type: boolean }
              errorCode: { type: string }
              errorMsg: { type: string }
              durationMs: { type: integer }

    Heartbeat:
      type: object
      required: [deviceId, online]
      properties:
        deviceId: { type: string }
        lockId: { type: string }
        online: { type: boolean }
        battery: { type: integer }
        rssi: { type: string }
        firmware: { type: string }
        reportTime: { type: string, format: date-time }

    MeterReading:
      type: object
      required: [meterNo, meterType, reading, readTime]
      properties:
        meterNo: { type: string }
        deviceId: { type: string }
        meterType:
          type: string
          enum: [ELEC, WATER, GAS, HEAT]
        reading: { type: number }
        previousReading: { type: number }
        multiplier: { type: number, description: 倍率，默认 1 }
        readTime: { type: string, format: date-time }
        source:
          type: string
          enum: [PULL, PUSH]
        freezeFlag: { type: boolean }

    DeviceStatus:
      type: object
      required: [deviceId, status, time]
      properties:
        deviceId: { type: string }
        status:
          type: string
          enum: [ONLINE, OFFLINE]
        reason:
          type: string
          enum: [NETWORK, POWER, SIGNAL, UNKNOWN]
        time: { type: string, format: date-time }

    AlarmAck:
      type: object
      required: [eventId, recovered]
      properties:
        eventId: { type: string }
        recovered: { type: boolean }
        recoverTime: { type: string, format: date-time }

# ============================================================================
# 平台 → IoT 下行接口（供 IoT 方实现对照；不在本服务端渲染，仅作文档）
# ============================================================================
x-iot-downstream:
  - path: /ymd/auth-service/sys/getAccessToken
    method: POST
    status: 已实现
    purpose: 取 Token
  - path: /ymd/lockPt-service/pt/getPtAgentLocks
    method: POST
    status: 已实现
    purpose: 代理商门锁清单
  - path: /ymd/lockPt-service/pt/getLockInfo
    method: POST
    status: 已实现
    purpose: 门锁详情
  - path: /ymd/restful/channel/auth/action
    method: POST
    status: 已实现（参数待联调）
    purpose: 人员授权；门锁标识用 lockId
  - path: /ymd/restful/auth/action
    method: POST
    status: 已实现（参数待联调）
    purpose: 通用介质授权（卡/密码/人脸）
  - path: /ymd/restful/auth/delAuthById
    method: POST
    status: 已实现（参数待联调）
    purpose: 删除授权
  - path: /ymd/restful/syncTask/result/list
    method: POST
    status: 已实现
    purpose: 异步任务结果查询
  - path: /ymd/restful/lock/open
    method: POST
    status: 待 IoT 提供
    purpose: 远程开锁（lockId + requestId）
  - path: /ymd/restful/device/reboot
    method: POST
    status: 待 IoT 提供
    purpose: 远程重启
  - path: /ymd/restful/device/syncTime
    method: POST
    status: 待 IoT 提供
    purpose: 远程校时
  - path: /ymd/restful/meter/readings
    method: POST
    status: 待 IoT 提供
    purpose: 表计读数拉取（meterNos + from/to）
  - path: /ymd/restful/meter/switch
    method: POST
    status: 待 IoT 提供
    purpose: 电表拉合闸（TRIP/RESTORE）

  - path: /ymd/restful/lock/mode
    method: POST
    status: 待 IoT 提供
    purpose: 常开/常闭/恢复（mode=OPEN|CLOSE|NORMAL，requestId 幂等）
    request:
      requestId: string
      lockId: string
      mode: string
    response:
      code: string
      message: string
      costMs: int
      data:
        lockId: string
        mode: string
        effective: bool
  - path: /ymd/restful/token
    method: POST
    status: 待 IoT 提供
    purpose: 取 Token / 续期（appId+timestamp+nonce+HMAC-SHA256 sign）
    request:
      appId: string
      timestamp: long
      nonce: string
      sign: string
    response:
      code: string
      data:
        token: string
        expiresIn: int
        pwdSeed: string
  - path: /ymd/restful/device/status
    method: POST
    status: 待 IoT 提供
    purpose: 批量设备状态（lockIds <=200，返回 online/battery/rssi/lastReportTime）
    request:
      lockIds: string[]
    response:
      code: string
      data:
        - lockId: string
          online: bool
          battery: int
          rssi: int
          lastReportTime: string
          firmware: string
