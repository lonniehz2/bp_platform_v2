services:
  mysql:
    image: mysql:8.0
    container_name: bp-mysql-local
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bp_platform_v2}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - bp-mysql-data:/var/lib/mysql
      - ../platform-sql:/sql:ro
      - ./seed:/seed:ro
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  bp-mysql-data:
