server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: multi-scene-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.31.153:33306/bp_platform_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.yundao.platform: info


bp:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  file:
    root: ${FILE_ROOT:uploads}
  auth:
    secret: ${AUTH_SECRET:dev-only-change-me}
    ttl-seconds: 28800
